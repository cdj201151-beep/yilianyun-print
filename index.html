<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#9B1D6B"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="易联云打印"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.png" type="image/png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png"/>
<title>易联云多终端打印</title>
<!-- CryptoJS 用于MD5签名，Safari正常支持 -->
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{background:#f5f7fa;padding:20px;max-width:760px;margin:0 auto;color:#333}
.header{margin-bottom:20px}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
.tip{color:#666;font-size:14px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:20px;margin-bottom:16px}
.label{display:block;margin-bottom:8px;font-weight:500;font-size:15px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none;transition:border .2s;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#007aff}
textarea{min-height:220px;line-height:1.6;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.col{flex:1;min-width:180px}
.btns{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
button{flex:1;min-width:110px;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .2s}
.btn-print{background:#007aff;color:#fff}
.btn-toggle-add{background:#34c759;color:#fff}
.btn-confirm-add{background:#007aff;color:#fff}
.btn-del{background:#ff3b30;color:#fff}
.btn-clear{background:#eee;color:#333}
.btn-check{background:#9B1D6B;color:#fff}
.status-box{margin-top:12px;padding:12px;border-radius:10px;background:#f8f8f8;font-size:15px;font-weight:500;color:#555;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-box .st-time{font-size:12px;font-weight:400;color:#999;margin-left:auto}
.status-tools{margin-top:8px;text-align:right}
.status-tools a{font-size:12px;color:#007aff;text-decoration:none}
.proxy-tip{font-size:12px;color:#999;margin-top:8px;line-height:1.5}
button:active{opacity:0.85}
button:disabled{opacity:0.5;cursor:not-allowed}
.info{margin-top:10px;padding:12px;background:#f8f8f8;border-radius:10px;font-size:13px;color:#555;word-break:break-all}
.device-item{padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hide-panel{display:none;margin-top:16px}
.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:14px;display:none}
.msg-success{background:#e8f9ee;color:#28a745}
.msg-error{background:#ffe9e9;color:#dc3545}
.footer{text-align:center;font-size:12px;color:#999;padding:24px 0 32px;line-height:1.6}
</style>
</head>
<body>
<div class="header">
  <h1>易联云多终端打印</h1>
  <div class="tip">支持添加、切换多个打印机终端，兼容Safari，终端自动本地保存</div>
</div>

<!-- 打印内容区（最上方） -->
<div class="card">
  <label class="label">打印内容</label>
  <textarea id="printContent" placeholder="在这里输入小票打印内容...
示例：
欢迎光临
----------------
商品A    10.00
商品B    25.00
----------------
合计：35.00
谢谢惠顾！"></textarea>
  <div class="btns">
    <button class="btn-print" id="btnPrint">发送打印</button>
    <button class="btn-clear" id="btnClear">清空内容</button>
  </div>
  <div id="msgBox" class="msg"></div>
</div>

<!-- 终端选择 -->
<div class="card">
  <div class="label">选择打印机</div>
  <select id="deviceSelect">
    <!-- JS动态渲染 -->
  </select>
  <div id="deviceListBox" class="info" style="margin-top:12px"></div>
  <div id="statusBox" class="status-box">状态：<span id="statusText">未检测</span><span class="st-time" id="statusTime"></span></div>
  <div class="status-tools"><a href="javascript:;" id="btnProxyToggle">接口设置</a></div>
  <div id="proxyPanel" class="hide-panel">
    <label class="label">状态查询代理地址（可选）</label>
    <input id="proxyUrl" placeholder="https://your-proxy.workers.dev/?url=">
    <div class="proxy-tip">易联云状态接口无跨域支持，浏览器需经代理访问；部署方法见仓库 README。</div>
    <div class="btns" style="margin-top:12px">
      <button class="btn-confirm-add" id="btnSaveProxy">保存代理</button>
      <button class="btn-clear" id="btnClearProxy">清除</button>
    </div>
  </div>
  <div class="btns" style="margin-top:16px">
    <button class="btn-check" id="btnCheck">检测状态</button>
    <button class="btn-toggle-add" id="btnToggleAdd">添加终端</button>
    <button class="btn-del" id="btnDelDev">删除选中终端</button>
  </div>
  <!-- 点击添加终端才显示的输入面板 -->
  <div id="addPanel" class="hide-panel">
    <div class="row">
      <div class="col">
        <label class="label">终端名称</label>
        <input id="devName" placeholder="请输入终端名称">
      </div>
      <div class="col">
        <label class="label">终端号 MACHINE_CODE</label>
        <input id="devCode" placeholder="请输入终端号">
      </div>
      <div class="col">
        <label class="label">终端密钥 MSIGN</label>
        <input id="devSign" placeholder="请输入终端密钥">
      </div>
    </div>
    <div class="btns">
      <button class="btn-confirm-add" id="btnConfirmAdd">确认添加</button>
    </div>
  </div>
</div>

<footer class="footer">Copyright © 2026 Luohe Inc. 保留所有权利。</footer>

<script>
const $ = s => document.querySelector(s)
const $$ = s => document.querySelectorAll(s)

// ========== 全局参数（隐藏，前端不展示） ==========
const YLY_PARTNER = "43422300"
const YLY_APIKEY = "e1b8752f3850e203e40fd29cccb1acc700b1057b"
const STORAGE_KEY = "yly_device_list"
const API_URL = "https://open-api.10ss.net/v2/print"
// ========== 状态查询配置 ==========
const STATUS_URL_OLD = "http://open.10ss.net:8888/getstatus.php"
const STATUS_URL_V2 = "https://open-api.10ss.net/v2/printer/getstatus"
// 可选：代理地址前缀，形如 "https://your-proxy.workers.dev/?url="
// 留空则按「v2 接口 → 直连 → 公共代理」顺序尝试（HTTPS 页面上直连会被浏览器拦截）
const PROXY_KEY = "yly_status_proxy"
let STATUS_PROXY = localStorage.getItem(PROXY_KEY) || ""

// 读取本地存储，没有则为空列表（无默认打印机）
let deviceList = []
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY))
  if(Array.isArray(saved)) deviceList = saved
}catch(e){ deviceList = [] }
// 清理旧版本残留的演示终端
deviceList = deviceList.filter(d => !(d && d.code === "4004974681" && d.sign === "616390347999"))

// 保存到本地存储
function saveDeviceList(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(deviceList))
}

const deviceSelect = $("#deviceSelect")
const deviceListBox = $("#deviceListBox")
const devName = $("#devName")
const devCode = $("#devCode")
const devSign = $("#devSign")
const printContent = $("#printContent")
const btnToggleAdd = $("#btnToggleAdd")
const btnConfirmAdd = $("#btnConfirmAdd")
const btnDelDev = $("#btnDelDev")
const btnPrint = $("#btnPrint")
const btnClear = $("#btnClear")
const addPanel = $("#addPanel")
const msgBox = $("#msgBox")
const btnCheck = $("#btnCheck")
const statusText = $("#statusText")
const statusTime = $("#statusTime")
const btnProxyToggle = $("#btnProxyToggle")
const proxyPanel = $("#proxyPanel")
const proxyUrlInput = $("#proxyUrl")
const btnSaveProxy = $("#btnSaveProxy")
const btnClearProxy = $("#btnClearProxy")
proxyUrlInput.value = STATUS_PROXY

function showMsg(text, isOk){
  msgBox.style.display = "block"
  msgBox.className = "msg " + (isOk ? "msg-success":"msg-error")
  msgBox.innerText = text
  setTimeout(()=>msgBox.style.display="none",3000)
}

// 渲染下拉+列表
function renderDevice(){
  deviceSelect.innerHTML = ""
  deviceListBox.innerHTML = ""
  if(deviceList.length === 0){
    const opt = document.createElement("option")
    opt.value = ""
    opt.innerText = "暂无终端，请先添加"
    deviceSelect.appendChild(opt)
    deviceSelect.disabled = true
    deviceListBox.innerText = "尚未添加任何打印机终端，点击下方「添加终端」开始配置。"
    return
  }
  deviceSelect.disabled = false
  deviceList.forEach((item,idx)=>{
    const opt = document.createElement("option")
    opt.value = idx
    opt.innerText = `【${item.name}】${item.code}`
    deviceSelect.appendChild(opt)

    const div = document.createElement("div")
    div.className = "device-item"
    div.innerHTML = `<span>${item.name}｜${item.code}</span>`
    deviceListBox.appendChild(div)
  })
}

// 展开/收起添加面板
btnToggleAdd.onclick = ()=>{
  if(addPanel.style.display === "block"){
    addPanel.style.display = "none"
    devName.value=""
    devCode.value=""
    devSign.value=""
  }else{
    addPanel.style.display = "block"
  }
}

// 确认添加终端
btnConfirmAdd.onclick = ()=>{
  const name = devName.value.trim()
  const code = devCode.value.trim()
  const sign = devSign.value.trim()
  if(!name || !code || !sign){
    showMsg("终端名称、终端号、终端密钥不能为空",false)
    return
  }
  deviceList.push({name,code,sign})
  saveDeviceList()
  renderDevice()
  addPanel.style.display = "none"
  devName.value=""
  devCode.value=""
  devSign.value=""
  showMsg("终端添加成功",true)
}

// 删除选中终端
btnDelDev.onclick = ()=>{
  if(deviceList.length === 0){
    showMsg("当前没有可删除的终端",false)
    return
  }
  const idx = Number(deviceSelect.value)
  if(isNaN(idx) || idx < 0 || idx >= deviceList.length){
    showMsg("请先选择要删除的终端",false)
    return
  }
  deviceList.splice(idx,1)
  saveDeviceList()
  renderDevice()
  showMsg("终端已删除",true)
}

// 易联云打印接口
btnPrint.onclick = async ()=>{
  const text = printContent.value.trim()
  if(!text){
    showMsg("请输入打印内容",false)
    return
  }
  const selIdx = Number(deviceSelect.value)
  const dev = deviceList[selIdx]
  if(!dev){
    showMsg("请先添加并选择打印机终端",false)
    return
  }
  btnPrint.disabled = true
  try{
    const timestamp = Math.floor(Date.now()/1000).toString()
    const nonce = Math.random().toString(36).slice(2)
    const signRaw = YLY_APIKEY + "timestamp" + timestamp + "nonce" + nonce + "machine_code" + dev.code + "msign" + dev.sign
    const sign = CryptoJS.MD5(signRaw).toString()

    const payload = {
      partner: YLY_PARTNER,
      machine_code: dev.code,
      timestamp,
      nonce,
      sign,
      content: text
    }
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    })
    const ret = await res.json()
    if(ret.error === 0){
      showMsg("✅ 打印指令下发成功！",true)
    }else{
      showMsg("❌ 打印失败："+ret.error_description,false)
    }
  }catch(e){
    showMsg("❌ 请求异常："+e.message,false)
  }finally{
    btnPrint.disabled = false
  }
}

btnClear.onclick = ()=>{
  printContent.value=""
  printContent.focus()
  msgBox.style.display="none"
}

// ========== 检测状态（手动触发，不轮询） ==========
let lastCheckAt = 0
let checking = false

function fetchWithTimeout(url, options, ms){
  const ctrl = new AbortController()
  const timer = setTimeout(()=>ctrl.abort(), ms || 12000)
  return fetch(url, Object.assign({}, options, {signal: ctrl.signal}))
    .finally(()=>clearTimeout(timer))
}

// 兼容多种返回格式：{"error":"0","body":{"state":"1"}} / {"state":1} / "status:1" / "1"
function parseState(raw){
  const txt = (raw || "").trim()
  if(!txt) return {fail:"接口返回为空"}
  if(txt.charAt(0) === "{"){
    try{
      const j = JSON.parse(txt)
      if(j.error !== undefined && String(j.error) !== "0"){
        return {fail: j.error_description || ("错误码 " + j.error)}
      }
      let s
      if(j.body && j.body.state !== undefined) s = j.body.state
      else if(j.state !== undefined) s = j.state
      else if(j.status !== undefined) s = j.status
      if(s === undefined) return {fail:"返回中无状态字段"}
      return {state: Number(s)}
    }catch(e){ return {fail:"返回格式无法解析"} }
  }
  const m = txt.match(/status\s*[:=]\s*([0-9])/i)
  if(m) return {state: Number(m[1])}
  if(/^[0-9]$/.test(txt)) return {state: Number(txt)}
  return {fail: txt.slice(0, 60)}
}

function setStatus(label, timeText){
  statusText.innerText = label
  statusTime.innerText = timeText || ""
}

function buildStatusChannels(dev){
  const ts = Math.floor(Date.now()/1000).toString()
  const nonce = Math.random().toString(36).slice(2)
  const signV2 = CryptoJS.MD5(YLY_APIKEY + "timestamp" + ts + "nonce" + nonce + "machine_code" + dev.code + "msign" + dev.sign).toString()
  const signOld = CryptoJS.MD5(YLY_APIKEY + "machine_code" + dev.code + "partner" + YLY_PARTNER + dev.sign).toString().toUpperCase()

  const formBody = "partner=" + encodeURIComponent(YLY_PARTNER)
    + "&machine_code=" + encodeURIComponent(dev.code)
    + "&sign=" + signOld

  const oldOpts = {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body: formBody
  }

  const list = []
  // 1) 自带代理（推荐，配了才走）
  if(STATUS_PROXY){
    list.push({name:"代理", url: STATUS_PROXY + encodeURIComponent(STATUS_URL_OLD), options: oldOpts})
  }
  // 2) v2 状态接口（与打印同一域名，若网关支持可直接用）
  list.push({
    name:"v2接口",
    url: STATUS_URL_V2,
    options:{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({partner:YLY_PARTNER, machine_code:dev.code, timestamp:ts, nonce:nonce, sign:signV2})
    }
  })
  // 3) 老接口直连（仅非 HTTPS 环境可能成功）
  list.push({name:"直连", url: STATUS_URL_OLD, options: oldOpts})
  // 4) 公共代理兜底（可能限流）
  list.push({name:"公共代理", url: "https://api.cors.lol/?url=" + encodeURIComponent(STATUS_URL_OLD), options: oldOpts})
  return list
}

async function checkStatus(){
  if(checking) return
  if(deviceList.length === 0){
    showMsg("请先添加打印机终端", false)
    return
  }
  const idx = Number(deviceSelect.value)
  const dev = deviceList[idx]
  if(!dev){
    showMsg("请先选择打印机终端", false)
    return
  }
  // 简单节流：3 秒内不重复请求，避免频繁调用触发限频
  const now = Date.now()
  if(now - lastCheckAt < 3000){
    showMsg("操作太频繁，请稍后再试", false)
    return
  }
  lastCheckAt = now
  checking = true
  btnCheck.disabled = true
  const oldLabel = btnCheck.innerText
  btnCheck.innerText = "检测中…"
  setStatus("检测中…", "")

  const channels = buildStatusChannels(dev)
  let lastErr = "网络异常"
  try{
    for(const ch of channels){
      try{
        const res = await fetchWithTimeout(ch.url, ch.options, 12000)
        const text = await res.text()
        const parsed = parseState(text)
        if(parsed.state !== undefined){
          const map = {0:"🔴 离线", 1:"🟢 在线", 2:"🟠 缺纸（在线）"}
          const label = map[parsed.state] || ("⚪ 未知状态（" + parsed.state + "）")
          setStatus(label, new Date().toLocaleTimeString("zh-CN", {hour12:false}))
          checking = false
          btnCheck.disabled = false
          btnCheck.innerText = oldLabel
          return
        }
        lastErr = parsed.fail || lastErr
      }catch(e){
        lastErr = e.name === "AbortError" ? "请求超时" : (e.message || lastErr)
      }
    }
    setStatus("⚠️ 检测失败", "")
    showMsg("检测失败：" + lastErr + "（浏览器跨域限制，需配置代理，见 README）", false)
  }finally{
    checking = false
    btnCheck.disabled = false
    btnCheck.innerText = oldLabel
  }
}

btnCheck.onclick = checkStatus

// 接口设置：代理地址（独立 key，不影响终端数据）
btnProxyToggle.onclick = ()=>{
  proxyPanel.style.display = proxyPanel.style.display === "block" ? "none" : "block"
}
btnSaveProxy.onclick = ()=>{
  const v = proxyUrlInput.value.trim()
  if(v && !/^https?:\/\//i.test(v)){
    showMsg("代理地址需以 http:// 或 https:// 开头", false)
    return
  }
  STATUS_PROXY = v
  if(v) localStorage.setItem(PROXY_KEY, v)
  else localStorage.removeItem(PROXY_KEY)
  proxyPanel.style.display = "none"
  setStatus("未检测", "")
  showMsg(v ? "代理已保存" : "代理已清除", true)
}
btnClearProxy.onclick = ()=>{
  proxyUrlInput.value = ""
  STATUS_PROXY = ""
  localStorage.removeItem(PROXY_KEY)
  setStatus("未检测", "")
  showMsg("代理已清除", true)
}

// 切换终端时清空上一次的检测结果
deviceSelect.onchange = ()=>{ setStatus("未检测", "") }

// 初始化
renderDevice()
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(()=>{});
  });
}
</script>
</body>
</html>
