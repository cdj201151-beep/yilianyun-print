<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#9B1D6B"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="易联云打印"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="favicon.png" type="image/png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png"/>
<title>易联云多终端打印</title>
<!-- CryptoJS 用于MD5签名，Safari正常支持 -->
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{background:#f5f7fa;padding:20px;max-width:760px;margin:0 auto;color:#333}
.header{margin-bottom:20px}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
.tip{color:#666;font-size:14px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:20px;margin-bottom:16px}
.label{display:block;margin-bottom:8px;font-weight:500;font-size:15px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;outline:none;transition:border .2s;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#007aff}
textarea{min-height:220px;line-height:1.6;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.col{flex:1;min-width:180px}
.btns{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
button{flex:1;min-width:110px;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .2s}
.btn-print{background:#007aff;color:#fff}
.btn-toggle-add{background:#34c759;color:#fff}
.btn-confirm-add{background:#007aff;color:#fff}
.btn-del{background:#ff3b30;color:#fff}
.btn-clear{background:#eee;color:#333}
button:active{opacity:0.85}
button:disabled{opacity:0.5;cursor:not-allowed}
.info{margin-top:10px;padding:12px;background:#f8f8f8;border-radius:10px;font-size:13px;color:#555;word-break:break-all}
.device-item{padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.hide-panel{display:none;margin-top:16px}
.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:14px;display:none}
.msg-success{background:#e8f9ee;color:#28a745}
.msg-error{background:#ffe9e9;color:#dc3545}
.footer{text-align:center;font-size:12px;color:#999;padding:24px 0 32px;line-height:1.6}
.api-tools{margin-top:10px;text-align:right}
.api-tools a{font-size:12px;color:#007aff;text-decoration:none}
.proxy-tip{font-size:12px;color:#999;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="header">
  <h1>易联云多终端打印</h1>
  <div class="tip">支持添加、切换多个打印机终端，兼容Safari，终端自动本地保存</div>
</div>

<!-- 打印内容区（最上方） -->
<div class="card">
  <label class="label">打印内容</label>
  <textarea id="printContent" placeholder="在这里输入小票打印内容...
示例：
欢迎光临
----------------
商品A    10.00
商品B    25.00
----------------
合计：35.00
谢谢惠顾！"></textarea>
  <div class="btns">
    <button class="btn-print" id="btnPrint">发送打印</button>
    <button class="btn-clear" id="btnClear">清空内容</button>
  </div>
  <div id="msgBox" class="msg"></div>
  <div class="api-tools"><a href="javascript:;" id="btnProxyToggle">接口设置</a></div>
  <div id="proxyPanel" class="hide-panel">
    <label class="label">打印接口代理地址（可选）</label>
    <input id="proxyUrl" placeholder="https://your-proxy.workers.dev/?url=">
    <div class="proxy-tip">易联云打印接口只有 HTTP 非标准端口且无跨域支持，浏览器需经代理访问；部署方法见仓库 README。</div>
    <div class="btns" style="margin-top:12px">
      <button class="btn-confirm-add" id="btnSaveProxy">保存代理</button>
      <button class="btn-clear" id="btnClearProxy">清除</button>
    </div>
  </div>
</div>

<!-- 终端选择 -->
<div class="card">
  <div class="label">选择打印机</div>
  <select id="deviceSelect">
    <!-- JS动态渲染 -->
  </select>
  <div id="deviceListBox" class="info" style="margin-top:12px"></div>
  <div class="btns" style="margin-top:16px">
    <button class="btn-toggle-add" id="btnToggleAdd">添加终端</button>
    <button class="btn-del" id="btnDelDev">删除选中终端</button>
  </div>
  <!-- 点击添加终端才显示的输入面板 -->
  <div id="addPanel" class="hide-panel">
    <div class="row">
      <div class="col">
        <label class="label">终端名称</label>
        <input id="devName" placeholder="请输入终端名称">
      </div>
      <div class="col">
        <label class="label">终端号 MACHINE_CODE</label>
        <input id="devCode" placeholder="请输入终端号">
      </div>
      <div class="col">
        <label class="label">终端密钥 MSIGN</label>
        <input id="devSign" placeholder="请输入终端密钥">
      </div>
    </div>
    <div class="btns">
      <button class="btn-confirm-add" id="btnConfirmAdd">确认添加</button>
    </div>
  </div>
</div>

<footer class="footer">Copyright © 2026 Luohe Inc. 保留所有权利。</footer>

<script>
const $ = s => document.querySelector(s)
const $$ = s => document.querySelectorAll(s)

// ========== 全局参数（隐藏，前端不展示） ==========
const YLY_PARTNER = "43422300"
const YLY_APIKEY = "e1b8752f3850e203e40fd29cccb1acc700b1057b"
const STORAGE_KEY = "yly_device_list"
// ========== 打印接口配置（老版 partner 接口，实测可用） ==========
const PRINT_URL = "http://open.10ss.net:8888/print.php"
// 可选：代理地址前缀，形如 "https://your-proxy.workers.dev/?url="
// HTTPS 页面直连会被浏览器拦截，配置代理后打印才可用
const API_PROXY_KEY = "yly_api_proxy"
let PRINT_PROXY = localStorage.getItem(API_PROXY_KEY) || ""


// 读取本地存储，没有则为空列表（无默认打印机）
let deviceList = []
try{
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY))
  if(Array.isArray(saved)) deviceList = saved
}catch(e){ deviceList = [] }
// 清理旧版本残留的演示终端
deviceList = deviceList.filter(d => !(d && d.code === "4004974681" && d.sign === "616390347999"))

// 保存到本地存储
function saveDeviceList(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(deviceList))
}

const deviceSelect = $("#deviceSelect")
const deviceListBox = $("#deviceListBox")
const devName = $("#devName")
const devCode = $("#devCode")
const devSign = $("#devSign")
const printContent = $("#printContent")
const btnToggleAdd = $("#btnToggleAdd")
const btnConfirmAdd = $("#btnConfirmAdd")
const btnDelDev = $("#btnDelDev")
const btnPrint = $("#btnPrint")
const btnClear = $("#btnClear")
const addPanel = $("#addPanel")
const msgBox = $("#msgBox")
const btnProxyToggle = $("#btnProxyToggle")
const proxyPanel = $("#proxyPanel")
const proxyUrlInput = $("#proxyUrl")
const btnSaveProxy = $("#btnSaveProxy")
const btnClearProxy = $("#btnClearProxy")
proxyUrlInput.value = PRINT_PROXY

function showMsg(text, isOk){
  msgBox.style.display = "block"
  msgBox.className = "msg " + (isOk ? "msg-success":"msg-error")
  msgBox.innerText = text
  setTimeout(()=>msgBox.style.display="none",3000)
}

// 渲染下拉+列表
function renderDevice(){
  deviceSelect.innerHTML = ""
  deviceListBox.innerHTML = ""
  if(deviceList.length === 0){
    const opt = document.createElement("option")
    opt.value = ""
    opt.innerText = "暂无终端，请先添加"
    deviceSelect.appendChild(opt)
    deviceSelect.disabled = true
    deviceListBox.innerText = "尚未添加任何打印机终端，点击下方「添加终端」开始配置。"
    return
  }
  deviceSelect.disabled = false
  deviceList.forEach((item,idx)=>{
    const opt = document.createElement("option")
    opt.value = idx
    opt.innerText = `【${item.name}】${item.code}`
    deviceSelect.appendChild(opt)

    const div = document.createElement("div")
    div.className = "device-item"
    div.innerHTML = `<span>${item.name}｜${item.code}</span>`
    deviceListBox.appendChild(div)
  })
}

// 展开/收起添加面板
btnToggleAdd.onclick = ()=>{
  if(addPanel.style.display === "block"){
    addPanel.style.display = "none"
    devName.value=""
    devCode.value=""
    devSign.value=""
  }else{
    addPanel.style.display = "block"
  }
}

// 确认添加终端
btnConfirmAdd.onclick = ()=>{
  const name = devName.value.trim()
  const code = devCode.value.trim()
  const sign = devSign.value.trim()
  if(!name || !code || !sign){
    showMsg("终端名称、终端号、终端密钥不能为空",false)
    return
  }
  deviceList.push({name,code,sign})
  saveDeviceList()
  renderDevice()
  addPanel.style.display = "none"
  devName.value=""
  devCode.value=""
  devSign.value=""
  showMsg("终端添加成功",true)
}

// 删除选中终端
btnDelDev.onclick = ()=>{
  if(deviceList.length === 0){
    showMsg("当前没有可删除的终端",false)
    return
  }
  const idx = Number(deviceSelect.value)
  if(isNaN(idx) || idx < 0 || idx >= deviceList.length){
    showMsg("请先选择要删除的终端",false)
    return
  }
  deviceList.splice(idx,1)
  saveDeviceList()
  renderDevice()
  showMsg("终端已删除",true)
}

// 易联云打印接口
btnPrint.onclick = async ()=>{
  const text = printContent.value.trim()
  if(!text){
    showMsg("请输入打印内容",false)
    return
  }
  const selIdx = Number(deviceSelect.value)
  const dev = deviceList[selIdx]
  if(!dev){
    showMsg("请先添加并选择打印机终端",false)
    return
  }
  btnPrint.disabled = true
  try{
    const timestamp = Math.floor(Date.now()/1000).toString()
    const sign = CryptoJS.MD5(
      YLY_APIKEY + "machine_code" + dev.code + "partner" + YLY_PARTNER + "time" + timestamp + dev.sign
    ).toString().toUpperCase()

    const body = new URLSearchParams({
      partner: YLY_PARTNER,
      machine_code: dev.code,
      time: timestamp,
      sign: sign,
      content: text
    })
    const options = {
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body: body.toString()
    }

    // 通道1：代理（已配置则优先）
    let res = null
    if(PRINT_PROXY){
      try{
        res = await fetch(PRINT_PROXY + encodeURIComponent(PRINT_URL), options)
      }catch(e){ res = null }
    }
    // 通道2：直连（仅非 HTTPS 环境可能成功）
    if(!res || !res.ok){
      res = await fetch(PRINT_URL, options)
    }

    const retText = (await res.text()).trim()
    if(retText.charAt(0) === "{"){
      const ret = JSON.parse(retText)
      const st = String(ret.state)
      if(st === "1"){
        showMsg("✅ 打印指令已下发"+(ret.id ? "（单号 "+ret.id+"）" : "")+"！",true)
      }else if(st === "2"){
        showMsg("❌ 提交超时（时间戳超过3分钟），请校准手机时间后重试",false)
      }else if(st === "3"){
        showMsg("❌ 打印失败：参数有误，请检查终端号/密钥",false)
      }else if(st === "4"){
        showMsg("❌ 打印失败：sign 签名验证失败，请检查终端密钥",false)
      }else{
        showMsg("❌ 打印失败："+retText,false)
      }
    }else{
      showMsg("❌ 打印失败：接口返回异常 "+retText.slice(0,50),false)
    }
  }catch(e){
    if(PRINT_PROXY){
      showMsg("❌ 请求异常："+e.message+"（请检查代理地址是否可用）",false)
    }else{
      showMsg("❌ 请求异常："+e.message+"（浏览器跨域限制，请点下方「接口设置」配置代理）",false)
    }
  }finally{
    btnPrint.disabled = false
  }
}

// 接口设置：打印代理地址（独立 key，不影响终端数据）
btnProxyToggle.onclick = ()=>{
  proxyPanel.style.display = proxyPanel.style.display === "block" ? "none" : "block"
}
btnSaveProxy.onclick = ()=>{
  const v = proxyUrlInput.value.trim()
  if(v && !/^https?:\/\//i.test(v)){
    showMsg("代理地址需以 http:// 或 https:// 开头", false)
    return
  }
  PRINT_PROXY = v
  if(v) localStorage.setItem(API_PROXY_KEY, v)
  else localStorage.removeItem(API_PROXY_KEY)
  proxyPanel.style.display = "none"
  showMsg(v ? "代理已保存" : "代理已清除", true)
}
btnClearProxy.onclick = ()=>{
  proxyUrlInput.value = ""
  PRINT_PROXY = ""
  localStorage.removeItem(API_PROXY_KEY)
  showMsg("代理已清除", true)
}

btnClear.onclick = ()=>{
  printContent.value=""
  printContent.focus()
  msgBox.style.display="none"
}

// 初始化
renderDevice()
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(()=>{});
  });
}
</script>
</body>
</html>
